# docker compose up -d   (copy .env.example to .env first)
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: klarpost
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: klarpost
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U klarpost"]
      interval: 5s
      retries: 10

  web:
    build: { context: ., target: web }
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://klarpost:${POSTGRES_PASSWORD}@db:5432/klarpost
    depends_on: { db: { condition: service_healthy } }
    # Bound to localhost: put Caddy or another reverse proxy with HTTPS in front.
    ports: ["127.0.0.1:3020:3000"]

  worker:
    build: { context: ., target: worker }
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://klarpost:${POSTGRES_PASSWORD}@db:5432/klarpost
    depends_on: { db: { condition: service_healthy }, web: { condition: service_started } }

volumes:
  pgdata:
