name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Accuracy evaluation (fails if any personal data would leak)
        run: npm run eval
      - name: Publish evaluation report
        run: cat eval/REPORT.md >> "$GITHUB_STEP_SUMMARY"
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1

  docker:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - run: docker build --target web -t klarpost-web .
      - run: docker build --target worker -t klarpost-worker .
